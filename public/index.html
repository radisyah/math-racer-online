<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b0f1a" />
    <link rel="manifest" href="manifest.json" />
    <title>Math Racer Online</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%8E%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        box-sizing: border-box;
        --bg: #0b0f1a;
        --fg: #e8f0ff;
        --c1: #00e5ff;
        --c2: #ffa500;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, Segoe UI, Arial, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      h1,
      .hint {
        display: none;
      }
      #wrap {
        position: absolute;
        left: 0;
        top: 0;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #hud {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr;
        pointer-events: none;
      }
      .hp {
        position: relative;
        border-left: 1px solid #000;
      }
      .q {
        position: absolute;
        top: 64px;
        left: 6px;
        right: 6px;
        max-width: 560px;
        margin: 0 auto;
        background: #0b0f1acc;
        border: 2px solid;
        border-radius: 8px;
        padding: 4px;
        text-align: center;
        font-size: clamp(11px, 2vw, 16px);
        font-weight: 700;
      }
      .bar {
        position: absolute;
        left: 6px;
        right: 6px;
        height: 5px;
        background: #0008;
        border-radius: 3px;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 3px;
      }
      .st {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 6px;
        display: flex;
        justify-content: space-between;
        font-size: clamp(11px, 2vw, 15px);
        font-weight: 700;
        text-shadow: 0 1px 3px #000;
      }
      .ms {
        position: absolute;
        left: 0;
        right: 0;
        top: 42%;
        text-align: center;
        font-size: clamp(18px, 4vw, 30px);
        font-weight: 800;
        text-shadow: 0 2px 6px #000;
      }
      #ov {
        position: absolute;
        inset: 0;
        background: rgba(5, 8, 16, 0.93);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px;
        text-align: center;
        z-index: 5;
        overflow: auto;
      }
      #ov p {
        margin: 0;
        font-size: 13px;
        opacity: 0.88;
        max-width: 440px;
      }
      button {
        background: #00e5ff;
        color: #001018;
        border: 0;
        border-radius: 10px;
        padding: 11px 16px;
        font-size: 15px;
        font-weight: 700;
        width: 100%;
        max-width: 260px;
        cursor: pointer;
      }
      .hint {
        font-size: 11px;
        opacity: 0.6;
        text-align: center;
        margin-top: 6px;
      }
      #ov .in {
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        width: 100%;
      }
      #ov h3 {
        margin: 2px 0 0;
        font-size: 14px;
        letter-spacing: 1px;
      }
      #ov details {
        max-width: 480px;
        font-size: 12px;
        opacity: 0.88;
      }
      #ov summary {
        cursor: pointer;
        opacity: 0.8;
      }
      .row {
        display: grid;
        grid-template-columns: 30px repeat(3, 1fr);
        gap: 6px;
        width: 100%;
        max-width: 620px;
        align-items: stretch;
      }
      .row > b {
        align-self: center;
        font-size: 14px;
      }
      .card {
        background: #101a2e;
        border: 2px solid #2a3550;
        border-radius: 10px;
        padding: 4px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 1px;
        font-size: 12px;
        font-weight: 700;
        user-select: none;
        -webkit-user-select: none;

      }
      .card img {
        width: 100%;

        border-radius: 6px;

      }
      .card small {
        font-size: 9.5px;
        font-weight: 400;

      }
      .card.on {
        border-color: var(--c);

      .lv {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
        max-width: 620px;
        margin-top: 2px;
      }
      .lv button {
        flex: 1 1 150px;
        max-width: none;
        width: auto;
      }
      #snd,
      #fs {
        position: absolute;
        top: calc(6px + env(safe-area-inset-top, 0px));
        right: calc(8px + env(safe-area-inset-right, 0px));
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: 50%;
        font-size: 15px;
        background: #0b0f1acc;
        color: #fff;
        border: 1px solid #fff4;
        z-index: 6;
      }
      #fs {
        right: calc(52px + env(safe-area-inset-right, 0px));
      }
      /* tombol kiri/kanan di layar HP */
      #ctl {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 4;
        justify-content: space-between;
        padding: 0 calc(14px + env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) calc(14px + env(safe-area-inset-left, 0px));
        pointer-events: none;
      }
      #ctl button {
        pointer-events: auto;
        width: min(28vw, 130px);
        max-width: none;
        height: clamp(72px, 16vh, 110px);
        font-size: 40px;
        line-height: 1;
        padding: 0;
        border-radius: 18px;
        background: rgba(0, 229, 255, 0.28);
        color: #fff;
        border: 2px solid rgba(255, 255, 255, 0.55);

        user-select: none;

      }
      #ctl button:active {

      /* tombol ▲ = ngebut selama ditahan, dilepas = kembali ke kecepatan normal */
      #ctl #bu {
        width: min(34vw, 150px);
        background: rgba(255, 165, 0, 0.3);

      }
      #ctl #bu.on,
      #ctl #bu:active {

      }

      #cd {
        position: absolute;
        left: 0;
        right: 0;

        text-align: center;

      @keyframes pop {

        }

      #prog {
        position: absolute;
        left: 8px;

        z-index: 3;
        display: flex;
        flex-direction: column;
        gap: 3px;
        pointer-events: none;

      .pr {

      }
      .pr span {

      }
      .pb {

      #gap {

      .hp + .hp,

      .row3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        width: 100%;
        max-width: 620px;
      }
      .lvs {
        display: flex;
        gap: 6px;
        width: 100%;
        max-width: 620px;
      }
      .lvb {
        background: #1a2540;
        color: #e8f0ff;
        border: 2px solid #2a3550;
        padding: 8px 4px;

        max-width: none;
        flex: 1;
      }
      .lvb.on {
        border-color: var(--c1);

      }
      .alt {

        color: #e8f0ff;
      }
      .jn {
        display: flex;
        gap: 6px;
        flex: 1 1 220px;
      }
      .jn button {

      }
      #code {
        width: 92px;
        text-transform: uppercase;
        font-size: 18px;
        text-align: center;
        letter-spacing: 4px;
        border-radius: 10px;
        border: 2px solid #2a3550;

      body.master #prog,

      }
      #mbar {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;

        bottom: 0;
        height: 72px;
        margin: 0;
        padding: 4px 8px;
        align-content: center;
        background: #0b0f1a;

      }
      #mbar button {

        padding: 6px 14px;
        font-size: 13px;
      }
.slots {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        width: 100%;
        max-width: 420px;
      }
      .slot {
        background: #101a2e;

      }
      #ov .note {

        margin: 0;

  <body>
    <div id="app">
      <h1>MATH RACER · ONLINE PVP</h1>
      <button id="snd" onclick="toggleSnd()" title="Suara">🔊</button>
      <button id="fs" onclick="toggleFs()" title="Layar penuh">⛶</button>
      <div id="wrap">
        <canvas id="cv"></canvas>
        <div id="prog">
          <div class="pr">
            <span style="color: var(--c1)">KAMU</span>
            <div class="pb"><i id="pm" style="background: var(--c1)"></i></div>

          </div>
          <div class="pr" id="rowo">
            <span style="color: var(--c2)">LAWAN</span>

        </div>
        <div id="hud">
          <div class="hp">
            <div class="bar" style="top: 6px">
              <i id="b0" style="background: var(--c1)"></i>
            </div>
            <div class="bar" style="top: 12px; height: 3px">

            </div>
            <div class="q" id="q0" style="border-color: var(--c1)">-</div>
            <div class="ms" id="m0"></div>
            <div class="st">
              <span id="s0"></span
              ><span id="p0" style="color: var(--c1)">A/D · W</span>
            </div>
          </div>
          <div class="hp">
            <div class="bar" style="top: 6px">
              <i id="b1" style="background: var(--c2)"></i>
            </div>
            <div class="bar" style="top: 12px; height: 3px">
              <i id="o1" style="background: var(--c1)"></i>
            </div>
            <div class="q" id="q1" style="border-color: var(--c2)">-</div>
            <div class="ms" id="m1"></div>
            <div class="st">
              <span id="s1"></span
              ><span id="p1" style="color: var(--c2)">◀ ▶</span>
            </div>
          </div>
        </div>
        <div id="cd"></div>
        <div id="ov"></div>
      </div>
      <div id="mbar"></div>
      <div id="ctl">
        <button id="bl" aria-label="Kiri">◀</button>
        <button id="bu" aria-label="Ngebut (tahan)">▲</button>
        <button id="br" aria-label="Kanan">▶</button>
      </div>

      </div>

    <script src="net.js"></script>
    <script>
      const GAP = 700,
        VMAX = 64, // m/s ≈ 230 km/h
        VNIT = 96, // m/s ≈ 345 km/h saat nitro
        VBOOST = 80, // m/s ≈ 288 km/h saat tombol W / ▲ ditahan (dilepas = kembali ke VMAX)
        MBH = 72, // tinggi bilah kontrol Room Master (px)
        // ---- aturan skor (dihitung lokal di tiap perangkat, bebas jeda jaringan)
        PTS_OK = 100, // poin tiap jawaban benar
        PTS_BAD = 50, // pengurang tiap jawaban salah (membuat asal tebak tidak menguntungkan)
        NG = 10,
        FIN = GAP * NG + 200,
        LEN = FIN + 400,
        LW = 8,
        COL = ["#00e5ff", "#ffa500"],
        BC = [0x00c8ff, 0xff8c00],
        BD = ["#00b4ff", "#ffd400", "#ff4fa3"];
      const $ = (id) => document.getElementById(id);
      let RNG = Math.random;
      const r = (a, b) => a + Math.floor(RNG() * (b - a + 1)),
        pick = (a) => a[r(0, a.length - 1)];
      // ---- Generator soal aritmatika: + − × ÷ dengan urutan operasi biasa
      // Lv1 = 2 suku, Lv2 = 3 suku, Lv3 = 4 suku. Hasil selalu bilangan bulat >= 0. Lv2/Lv3 juga memuat soal berkurung.
      const NTERM = [2, 3, 4];
      const divisorsOf = (v) => {
        const d = [];
        for (let i = 2; i <= 12; i++) if (v % i === 0) d.push(i);
        return d;
      };
      function arithQ(n) {
        for (let tries = 0; tries < 200; tries++) {
          // pilih operator di antara suku-suku
          const ops = [];
          for (let i = 0; i < n - 1; i++) ops.push(pick(["+", "−", "×", "÷"]));
          // bagi menjadi kelompok tambah/kurang; tiap kelompok = rantai × ÷
          const groups = [];
          let cur = { sign: 1, ops: [] };
          groups.push(cur);
          ops.forEach((o) => {
            if (o === "+" || o === "−") {
              cur = { sign: o === "+" ? 1 : -1, ops: [] };
              groups.push(cur);
            } else cur.ops.push(o);
          });
          let total = 0,
            parts = [];
          groups.forEach((g, gi) => {
            const alone = g.ops.length === 0;
            let v = alone ? r(5, n === 2 ? 99 : 50) : r(2, 12);
            let txt = [String(v)];
            g.ops.forEach((o) => {
              if (o === "÷") {
                const d = divisorsOf(v);
                if (d.length) {
                  const b = pick(d);
                  v /= b;
                  txt.push("÷", String(b));
                  return;
                }
                o = "×"; // tidak bisa dibagi habis → ganti perkalian
              }
              const b = r(2, 9);
              v *= b;
              txt.push("×", String(b));
            });
            if (gi > 0) parts.push(g.sign > 0 ? "+" : "−");
            parts.push(txt.join(" "));
            total += g.sign * v;
          });
          if (total >= 0 && total <= 999) return [parts.join(" ") + " = ?", total];
        }
        return ["12 + 8 = ?", 20];
      }
      // ---- Soal berkurung (khusus Lv2 & Lv3), dibuat dari template agar hasil selalu bulat
      // sumP: "x ± y" yang bernilai tepat v (x, y > 0)
      function sumP(v) {
        if (v >= 2 && RNG() < 0.5) {
          const x = r(1, v - 1);
          return { t: `${x} + ${v - x}`, v };
        }
        const y = r(1, 15);
        return { t: `${v + y} − ${y}`, v };
      }
      // tambah/kurang satu suku di belakang; hasil tidak negatif
      function tail(base) {
        if (RNG() < 0.5) return ["+", r(2, 30)];
        return ["−", r(1, Math.min(base, 30))];
      }
      const parenGens = {
        2: [
          // (a ± b) × c
          () => {
            const S = sumP(r(2, 15)), c = r(2, 9);
            return [`(${S.t}) × ${c}`, S.v * c];
          },
          // a × (b ± c)
          () => {
            const S = sumP(r(2, 15)), a = r(2, 9);
            return [`${a} × (${S.t})`, a * S.v];
          },
          // (a ± b) ÷ c
          () => {
            const c = r(2, 9), k = r(2, 12), S = sumP(c * k);
            return [`(${S.t}) ÷ ${c}`, k];
          },
          // a ÷ (b ± c)
          () => {
            const s = r(2, 9), k = r(2, 12), S = sumP(s);
            return [`${s * k} ÷ (${S.t})`, k];
          },
        ],
        3: [
          // (a ± b) × (c ± d)
          () => {
            const A = sumP(r(2, 9)), B = sumP(r(2, 9));
            return [`(${A.t}) × (${B.t})`, A.v * B.v];
          },
          // (a ± b) × c ± d
          () => {
            const A = sumP(r(2, 12)), c = r(2, 9), p = A.v * c, [o, d] = tail(p);
            return [`(${A.t}) × ${c} ${o} ${d}`, o === "+" ? p + d : p - d];
          },
          // a ± (b ± c) × d
          () => {
            const A = sumP(r(2, 9)), c = r(2, 9), p = A.v * c;
            if (RNG() < 0.5) {
              const a = r(5, 40);
              return [`${a} + (${A.t}) × ${c}`, a + p];
            }
            const a = p + r(1, 20);
            return [`${a} − (${A.t}) × ${c}`, a - p];
          },
          // (a ± b) ÷ c ± d
          () => {
            const c = r(2, 9), k = r(2, 12), S = sumP(c * k), [o, d] = tail(k);
            return [`(${S.t}) ÷ ${c} ${o} ${d}`, o === "+" ? k + d : k - d];
          },
          // (a ± b ± c) × d
          () => {
            const A = sumP(r(3, 12)), plus = RNG() < 0.5;
            const z = plus ? r(1, 9) : r(1, A.v - 1);
            const v = plus ? A.v + z : A.v - z, d = r(2, 9);
            return [`(${A.t} ${plus ? "+" : "−"} ${z}) × ${d}`, v * d];
          },
          // a ÷ (b ± c) ± d
          () => {
            const s = r(2, 9), k = r(2, 12), S = sumP(s), [o, d] = tail(k);
            return [`${s * k} ÷ (${S.t}) ${o} ${d}`, o === "+" ? k + d : k - d];
          },
        ],
      };
      function genLevel(n) {
        // Lv2 & Lv3: ±50% soal berkurung, sisanya soal biasa
        if (n >= 3 && RNG() < 0.5) {
          for (let i = 0; i < 20; i++) {
            const [t, a] = pick(parenGens[n - 1])();
            if (a >= 0 && a <= 999) return [t + " = ?", a];
          }
        }
        return arithQ(n);
      }
      const gens = NTERM.map((n) => () => genLevel(n));
      // ---- 2D renderer (Canvas 2D, tanpa library)
      const DESIGNS = [
        {
          name: "Lamborghini",
          sub: "Wedge super rendah · lampu Y · sayap belakang",
          col: "#f2c200",
        },
        {
          name: "Porsche",
          sub: "Fastback klasik · lampu bulat · ekor bebek",
          col: "#b4bcc8",
        },
        {
          name: "Ferrari",
          sub: "Lekuk mulus · lampu belakang bulat ganda",
          col: "#d10a0a",
        },
      ];
      const SEL = [0, 1];
      let THUMBS = [];
      const cv = $("cv"),
        cx = cv.getContext("2d", { alpha: false });
      const VIEW_AHEAD = 80; // meter yang terlihat di depan mobil (kecil = terasa ngebut)
      let TOPY = 140; // batas atas area balap (di bawah kotak soal; disesuaikan tinggi kotak soal)
      let W = 600,
        H = 400,
        RX = 0,
        RW = 400,
        LP = 133,
        PXU = 2,
        CARY = 300;
      const hash = (n) => {

        f(`Skor ${pl.sc}`, pw - 8, 4, 13, "#fff", "right", 800, 0);
        c.fillStyle = "rgba(255,255,255,.18)";
        c.fillRect(8, 23, pw - 16, 7);
        c.fillStyle = col;
        c.fillRect(8, 23, (pw - 16) * Math.min(1, pl.d / FIN), 7);
        // kotak soal yang sedang dikerjakan pemain
        const q = MV.round && Q[pl.gi],
          txt = pl.ft != null ? `🏁 FINISH` : q ? q.t : MV.round ? "Menuju finish! 🏁" : "…";
        c.fillStyle = "rgba(11,15,26,.85)";
        rr(c, 6, 40, pw - 12, 30, 8);
        c.fill();
        c.lineWidth = 2;
        c.strokeStyle = col;
        c.stroke();
        mFit(c, txt, pw - 28, 17, 700);
        c.textAlign = "center";
        c.textBaseline = "middle";
        c.fillStyle = "#fff";
        c.fillText(txt, pw / 2, 56);
        // status bawah
        c.fillStyle = "rgba(11,15,26,.78)";
        c.fillRect(0, H - 24, pw, 24);
        f(`${Math.round(Math.abs(pl.sp) * 3.6)} km/h · 🔥${pl.st} · ${Math.min(pl.gi + 1, NG)}/${NG}`, pw / 2, H - 19, 13, "#fff", "center", 700, 0);
        if (pl.mt > 0) f(pl.msg, pw / 2, H * 0.42, Math.max(14, Math.min(26, pw / 14)), pl.mc, "center", 800, 4);
        // keadaan menunggu
        const note = !pl.here ? "Menunggu pemain masuk…" : !MV.round ? "Menunggu Room Master memulai…" : !pl.moved && pl.ft == null ? "Bersiap… 3‑2‑1" : "";
        if (note) {
          c.fillStyle = "rgba(5,8,16,.62)";
          c.fillRect(0, 74, pw, H - 98);
          f(note, pw / 2, H * 0.48, 16, "#fff", "center", 800, 3);
        }
      }
      function mBanner(c, full) {
        const r = MV.res,
          t = r.r === "draw" ? "🤝 SERI!" : `🏆 ${MNAMES[r.r === "win" ? 0 : 1]} MENANG!`,
          bw = Math.min(full - 24, 360),
          bh = 92,
          x = (full - bw) / 2,
          y = H * 0.4;
        c.fillStyle = "rgba(5,8,16,.92)";
        rr(c, x, y, bw, bh, 14);
        c.fill();
        c.lineWidth = 3;
        c.strokeStyle = r.r === "draw" ? "#ffd400" : COL[r.r === "win" ? 0 : 1];
        c.stroke();
        c.textAlign = "center";
        c.textBaseline = "middle";
        c.fillStyle = "#fff";
        mFit(c, t, bw - 20, 24, 800);
        c.fillText(t, full / 2, y + 28);
        c.font = "700 14px system-ui,Arial,sans-serif";
        c.fillText(`Skor ${r.a} vs ${r.b}`, full / 2, y + 56);
        c.font = "600 11px system-ui,Arial,sans-serif";
        c.fillStyle = "#9fb0d0";
        c.fillText(r.left != null ? `${MNAMES[r.left]} keluar · tekan ▶ Main lagi saat pemain kembali` : "Tekan ▶ Main lagi untuk ronde berikutnya", full / 2, y + 76);
      }
      // ---- race
      function startRace(seed, l) {
        if (run) return;
        lvl = l;
        audio();
        RNG = mulberry(seed);
        Q = Array.from({ length: NG }, mkQ);
        RNG = Math.random;
        me = mk();
        oppFinal = null;
        lastSent = "";
        lastWg = "";
        T = 0;
        cd = 3;
        cdn = 4;
        goT = 0;
        $("cd").textContent = "";
        $("p0").textContent = (SEAT ? "P" + (SEAT === "guest" ? 2 : 1) + " · " : "") + "A/D · W ⚡ · " + DESIGNS[SEL[0]].name;
        $("rowo").style.display = "none"; // lawan tidak terlihat
        $("ov").style.display = "none";
        phase = "race";
        run = true;
        document.body.classList.add("racing");
        last = performance.now();
        lastNet = 0;
        lastSeen = last;
        showQ();
        if (ROOM && ROLE !== "solo") ROOM.hot(false); // posisi lawan tidak dipakai, cukup polling santai
        if (ROOM && ROOM.live) ROOM.live(true); // bila ada Room Master, sync dipercepat selama balapan
        if (ROOM && ROLE !== "solo")
          ROOM.presence({
            round: ROUND,
            gi: 0,
            ok: 0,
            sc: 0,
            ft: null,
            car: SEL[0],
          }).catch(() => {});
        requestAnimationFrame(loop);
      }
      function showQ() {
        $("q0").textContent = me.gi < NG ? Q[me.gi].t : "Menuju finish! 🏁";
        fitTop();
      }
      function mv(n) {
        if (run && cd <= 0) {
          const l = Math.max(0, Math.min(2, n));
          if (l !== me.lane) SFX.sw(-1);
          me.lane = l;
        }
      }
      addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (run && k.startsWith("arrow")) e.preventDefault();
        K[k] = 1;
        if (!run || cd > 0) return;
        if (k === "a" || k === "arrowleft") mv(me.lane - 1);
        if (k === "d" || k === "arrowright") mv(me.lane + 1);
      });
      addEventListener("keyup", (e) => {
        K[e.key.toLowerCase()] = 0;
      });
      // lepas semua tombol bila jendela kehilangan fokus (mencegah ngebut/rem "nyangkut")
      const releaseAll = () => {
        K = {};
        setTB(false);
      };
      addEventListener("blur", releaseAll);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) releaseAll();
      });
      // tombol ▲ di layar (Android): tahan = ngebut, lepas = kembali normal
      function setTB(v) {
        TB = v;
        $("bu").classList.toggle("on", v);
      }
      (function () {
        const bu = $("bu");
        bu.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          try { bu.setPointerCapture(e.pointerId); } catch (x) {}
          setTB(true);
        });
        ["pointerup", "pointercancel", "lostpointercapture", "pointerleave"].forEach((ev) =>
          bu.addEventListener(ev, () => setTB(false))
        );
        bu.addEventListener("contextmenu", (e) => e.preventDefault());
      })();
      const tap = (e) => {
        if (!run) return;
        const b = cv.getBoundingClientRect();
        mv(Math.floor(((e.clientX - b.left - RX) / RW) * 3));
      };
      [["bl", -1], ["br", 1]].forEach(([id, d]) =>
        $(id).addEventListener("pointerdown", (e) => {
          e.preventDefault();
          if (run && me) mv(me.lane + d);
        })
      );
      cv.addEventListener("pointerdown", tap);
      cv.addEventListener("pointermove", (e) => {
        if (e.buttons) tap(e);
      });
      function loop(n) {
        if (!run) return;
        const dt = Math.min((n - last) / 1000, 0.05);
        last = n;
        upd(dt);
        net(n);
        check(n);
        if (run) frame(dt);
        requestAnimationFrame(loop);
      }
      function upd(dt) {
        if (cd > 0) {
          cd -= dt;
          const n = Math.ceil(cd);
          if (n > 0 && n !== cdn) {
            cdn = n;
            cdShow(n, "#ffd400");
            SFX.count();
          }
          if (cd <= 0) {
            cdShow("GO!", "#3dff7a");
            SFX.go();
            goT = 0.9;
          }
          return;
        }
        if (goT > 0) {
          goT -= dt;
          if (goT <= 0) $("cd").textContent = "";
        }
        T += dt;
        const p = me,
          fin = p.t !== null,
          b = !fin && (K.s || K.arrowdown), // rem manual (opsional, keyboard)
          g = !fin && !b, // gas otomatis: mobil jalan sendiri
          bst = g && !!(K.w || K.arrowup || TB); // W / ↑ / tombol ▲ ditahan = ngebut
        p.lx += (p.lane - p.lx) * Math.min(1, dt * 13);
        p.brp = p.br;
        p.br = false;
        p.nit = Math.max(0, p.nit - dt);
        if (g && !b) {
          // tenaga mesin menurun mendekati kecepatan maksimum
          p.sp +=
            (p.sp < 0 ? 34 : bst ? 34 : 22) *
            Math.max(0.05, 1 - Math.max(0, p.sp) / (bst ? VBOOST : VMAX)) *
            dt;
        } else if (b) {
          if (!p.brp && p.sp > 24) SFX.skid(-1);
          p.br = true;
          p.sp -= (p.sp > 0 ? 50 : 10) * dt;
        } else
          p.sp -=
            Math.sign(p.sp) *
            Math.min(Math.abs(p.sp), (3 + Math.abs(p.sp) * 0.11) * dt);
        if (p.nit > 0 && !b)
          p.sp += 60 * Math.max(0, 1 - p.sp / VNIT) * dt; // dorongan nitro
        const top = p.nit > 0 ? VNIT : bst ? VBOOST : VMAX; // lepas W → melewati batas → melambat kembali ke VMAX
        if (p.sp > top) p.sp -= Math.min(p.sp - top, 22 * dt);
        if (p.sp < -12) p.sp = -12;
        if (fin) {
          p.nit = 0;
          p.sp = Math.max(0, p.sp - 34 * dt); // mobil berhenti perlahan setelah finish
        }
        const o = p.d;
        p.d = Math.max(0, p.d + p.sp * dt);
        if (p.d === 0 && p.sp < 0) p.sp = 0;
        p.ds = p.d - o;
        p.mt -= dt;
        if (p.gi < NG && p.d >= (p.gi + 1) * GAP) {
          const q = Q[p.gi];
          if (p.lane === q.cl) {
            p.nit = 2.4;
            p.sp = Math.min(VNIT, p.sp + 16);
            p.st++;
            p.ok++;
            p.sc += PTS_OK;
            p.msg = "NITRO! 🔥 +" + PTS_OK;
            p.mc = COL[0];
            SFX.ok(-1);
            SFX.nitro(-1);
          } else {
            SFX.bad(-1);
            p.nit = 0;
            p.sp = Math.min(p.sp, 10);
            p.st = 0;
            p.sc -= PTS_BAD;
            p.msg = "Salah! −" + PTS_BAD + " · jawaban " + q.o[q.cl];
            p.mc = "#ff5577";
          }
          p.mt = 1.5;
          p.gT = T;
          p.gi++;
          showQ();
        }
        if (p.d >= FIN && p.t === null) p.t = T;
      }
      // Pemenang: skor tertinggi (benar +100, salah -50), murni dari jawaban benar/salah.
      // Waktu/durasi sama sekali tidak dipakai. Skor sama → jawaban benar sama → SERI.
      function judge(a, b) {
        if (a.sc !== b.sc) return a.sc > b.sc ? "win" : "lose";
        if (a.ok !== b.ok) return a.ok > b.ok ? "win" : "lose";
        return "draw";
      }
      // Kirim hanya data yang berubah (per gerbang & saat finish), bukan posisi tiap frame.
      function net(n) {
        if (!ROOM || ROLE === "solo" || n - lastNet < 200) return;
        lastNet = n;
        // Hanya bila ada Room Master yang menonton: kirim juga posisi/kecepatan/jalur (tanpa memicu sync mendesak)
        if (ROOM.watched && ROOM.watched())
          ROOM.presence({
            d: Math.round(me.d * 10) / 10,
            sp: Math.round(me.sp * 10) / 10,
            ln: Math.round(me.lx * 100) / 100,
            nt: me.nit > 0 ? 1 : 0,
          });
        const k = me.gi + "|" + me.ok + "|" + me.sc + "|" + (me.t === null ? "" : me.t);
        if (k === lastSent) return;
        lastSent = k;
        ROOM.presence({
          round: ROUND,
          gi: me.gi,
          ok: me.ok,
          sc: me.sc,
          ft: me.t,
        }).catch(() => {});
      }
      function showFinishWait(pr) {
        const gi = pr && pr.gi != null ? pr.gi : 0,
          txt = `Lawan sudah menjawab ${gi}/${NG} soal…`;
        if (!$("wg")) {
          lastWg = "";
          $("ov").style.display = "flex";
          $("ov").innerHTML = `<div class="in"><div style="font-size:38px">🏁</div><h3>KAMU SUDAH FINISH!</h3><p>Skor kamu: <b>${me.sc}</b> · Benar ${me.ok}/${NG}<br><span id="wg"></span></p><p>Pemenang = skor tertinggi (benar menambah, salah mengurangi). Waktu tidak dihitung.</p><button class="alt" onclick="leaveRoom()">Keluar ke menu</button></div>`;
        }
        if (txt !== lastWg) {
          lastWg = txt;
          $("wg").textContent = "Menunggu lawan menyelesaikan balapan. " + txt;
        }
      }
      function check(n) {
        if (ROLE === "solo") {
          if (me.t !== null) finish("win");
          return;
        }
        const pe = oppPeer(),
          pr = pe && pe.presence.round === ROUND ? pe.presence : null;
        if (pr && pr.ft != null) oppFinal = { ok: pr.ok || 0, sc: pr.sc || 0, t: pr.ft };
        if (pe) lastSeen = n;
        else if (!oppFinal && n - lastSeen > 4000)
          return finish("win", "Lawan keluar dari room.");
        if (me.t === null) return; // lawan selesai duluan? tetap lanjutkan balapanmu
        if (!me.tAt) me.tAt = n;
        if (oppFinal) return finish(judge({ ok: me.ok, sc: me.sc, t: me.t }, oppFinal));
        if (n - me.tAt > 90000) {
          const o = pr ? pr.sc || 0 : 0;
          return finish(me.sc >= o ? "win" : "lose", "Lawan terlalu lama menyelesaikan balapan.");
        }
        showFinishWait(pr);
      }
      function finish(res, msg) {
        if (!run) return;
        run = false;
        document.body.classList.remove("racing");
        phase = "done";
        if (ROOM && ROLE !== "solo")
          ROOM.presence({ gi: me.gi, ok: me.ok, sc: me.sc, ft: me.t, d: Math.round(me.d * 10) / 10, sp: 0, nt: 0 }).catch(() => {});
        if (ROOM && ROLE !== "solo") ROOM.hot(false);
        if (ROOM && ROOM.live) ROOM.live(false);
        const win = res === "win",
          draw = res === "draw",
          o2 = oppFinal;
        if (win || draw) SFX.fin();
        else SFX.bad(-1);
        silence();
        const o = $("ov"),
          icon = win ? "🏆" : draw ? "🤝" : "💥",
          col = win ? "#3dff7a" : draw ? "#ffd400" : "#ff5577",
          title = win ? "KAMU MENANG!" : draw ? "SERI!" : "KAMU KALAH",
          tie = o2 && me.t !== null && me.sc === o2.sc;
        o.style.display = "flex";
        o.innerHTML =
          `<div class="in"><div style="font-size:42px">${icon}</div><h2 style="margin:0;color:${col}">${title}</h2><p>${
            msg ? msg + "<br>" : ""
          }Skor: kamu <b>${me.sc}</b>${
            ROLE === "solo" || !o2 ? "" : ` · lawan <b>${o2.sc}</b>`
          }<br>Jawaban benar: ${me.ok}/${NG}${
            ROLE === "solo" || !o2 ? "" : ` · lawan ${o2.ok}/${NG}`
          }${
            tie ? "<br>Skor sama, jadi hasilnya seri (waktu tidak dihitung)." : ""
          }</p>` +
          (ROLE === "player"
            ? "<p>Menunggu Room Master memulai ronde berikutnya…</p>"
            : '<button onclick="soloStart()">Main lagi</button>') +
          '<button class="alt" onclick="leaveRoom()">Keluar ke menu</button></div>';
      }
      const HC = {};
      const setT = (id, v) => {
        if (HC[id] !== v) {
          HC[id] = v;
          $(id).textContent = v;
        }
      };
      const setW = (id, v) => {
        if (HC[id] !== v) {
          HC[id] = v;
          $(id).style.width = v;
        }
      };
      function hud() {
        const p = me,
          solo = ROLE === "solo";
        setW("pm", Math.round(Math.min(100, (p.d / FIN) * 100) * 10) / 10 + "%");
        setT("dm", Math.round(Math.min(p.d, FIN)) + " m");
        setT(
          "s0",
          `${p.sp < -0.3 ? "R " : ""}${Math.round(
            Math.abs(p.sp) * 3.6
          )} km/h · Skor ${p.sc} · 🔥${p.st} · ${Math.min(p.gi + 1, NG)}/${NG}`
        );
        setT("m0", p.mt > 0 ? p.msg : "");
        if (HC.mc !== p.mc) {
          HC.mc = p.mc;
          $("m0").style.color = p.mc;
        }
      }
      function frame(dt = 0) {
        const p = me;
        drawScene(p.d, p.lx, p.lane, p.sp, p.br);
        hud();
        engine();
      }
      function resize() {
        layout();
        sizeCanvas();
        fitTop();
        render();
      }
      addEventListener("resize", resize);
      addEventListener("pagehide", () => {
        if (ROOM && ROOM.beacon) ROOM.beacon();
      });
      layout();
      sizeCanvas();
      THUMBS = makeThumbs();
      resize();
      menu();
      (async () => {
        try {
          RM = window.MRNet ? window.MRNet.makeRM() : null;
        } catch (e) {
          RM = null;
        }
        if (phase === "menu") menu();
      })();
    </script>
  </body>
</html>
