<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Math Racer Online</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%8E%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #0b0f1a;
        --fg: #e8f0ff;
        --c1: #00e5ff;
        --c2: #ffa500;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, Segoe UI, Arial, sans-serif;
        display: flex;
        justify-content: center;
      }
      #app {
        width: 100%;
        max-width: 980px;
        padding: 8px;
      }
      h1 {
        font-size: 17px;
        margin: 2px 0 6px;
        letter-spacing: 2px;
        text-align: center;
      }
      #wrap {
        position: relative;
        border-radius: 10px;
        overflow: hidden;
        background: #000;
        margin: 0 auto;
      }
      canvas {
        display: block;
      }
      #hud {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr;
        pointer-events: none;
      }
      .hp {
        position: relative;
        border-left: 1px solid #000;
      }
      .q {
        position: absolute;
        top: 64px;
        left: 6px;
        right: 6px;
        background: #0b0f1acc;
        border: 2px solid;
        border-radius: 8px;
        padding: 4px;
        text-align: center;
        font-size: clamp(11px, 2vw, 16px);
        font-weight: 700;
      }
      .bar {
        position: absolute;
        left: 6px;
        right: 6px;
        height: 5px;
        background: #0008;
        border-radius: 3px;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 3px;
      }
      .st {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 6px;
        display: flex;
        justify-content: space-between;
        font-size: clamp(11px, 2vw, 15px);
        font-weight: 700;
        text-shadow: 0 1px 3px #000;
      }
      .ms {
        position: absolute;
        left: 0;
        right: 0;
        top: 42%;
        text-align: center;
        font-size: clamp(18px, 4vw, 30px);
        font-weight: 800;
        text-shadow: 0 2px 6px #000;
      }
      #ov {
        position: absolute;
        inset: 0;
        background: rgba(5, 8, 16, 0.93);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px;
        text-align: center;
        z-index: 5;
        overflow: auto;
      }
      #ov p {
        margin: 0;
        font-size: 13px;
        opacity: 0.88;
        max-width: 440px;
      }
      button {
        background: #00e5ff;
        color: #001018;
        border: 0;
        border-radius: 10px;
        padding: 11px 16px;
        font-size: 15px;
        font-weight: 700;
        width: 100%;
        max-width: 260px;
        cursor: pointer;
      }
      .hint {
        font-size: 11px;
        opacity: 0.6;
        text-align: center;
        margin-top: 6px;
      }
      #ov .in {
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        width: 100%;
      }
      #ov h3 {
        margin: 2px 0 0;
        font-size: 14px;
        letter-spacing: 1px;
      }
      #ov details {
        max-width: 480px;
        font-size: 12px;
        opacity: 0.88;
      }
      #ov summary {
        cursor: pointer;
        opacity: 0.8;
      }
      .row {
        display: grid;
        grid-template-columns: 30px repeat(3, 1fr);
        gap: 6px;
        width: 100%;
        max-width: 620px;
        align-items: stretch;
      }
      .row > b {
        align-self: center;
        font-size: 14px;
      }
      .card {
        background: #101a2e;
        border: 2px solid #2a3550;
        border-radius: 10px;
        padding: 4px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 1px;
        font-size: 12px;
        font-weight: 700;
        user-select: none;
        -webkit-user-select: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .card img {
        width: 100%;
        display: block;
        border-radius: 6px;
        pointer-events: none;
      }
      .card small {
        font-size: 9.5px;
        font-weight: 400;
        opacity: 0.7;
        line-height: 1.25;
      }
      .card.on {
        border-color: var(--c);
        box-shadow: 0 0 12px var(--c);
      }
      .lv {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
        max-width: 620px;
        margin-top: 2px;
      }
      .lv button {
        flex: 1 1 150px;
        max-width: none;
        width: auto;
      }
      #app {
        position: relative;
      }
      #snd {
        position: absolute;
        top: 2px;
        right: 8px;
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 50%;
        font-size: 15px;
        background: #0b0f1acc;
        color: #fff;
        border: 1px solid #fff4;
        z-index: 6;
      }
      #cd {
        position: absolute;
        left: 0;
        right: 0;
        top: 30%;
        text-align: center;
        font-size: clamp(64px, 16vw, 150px);
        font-weight: 900;
        line-height: 1;
        pointer-events: none;
        z-index: 4;
        text-shadow: 0 4px 18px #000, 0 0 30px currentColor;
        animation: none;
      }
      #cd.pop {
        animation: pop 0.9s ease-out;
      }
      @keyframes pop {
        0% {
          transform: scale(1.7);
          opacity: 0;
        }
        25% {
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 0.95;
        }
      }
      #prog {
        position: absolute;
        left: 8px;
        right: 8px;
        top: 6px;
        z-index: 3;
        display: flex;
        flex-direction: column;
        gap: 3px;
        pointer-events: none;
        font-size: clamp(10px, 1.8vw, 13px);
        font-weight: 700;
        text-shadow: 0 1px 3px #000;
      }
      .pr {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .pr span {
        width: 50px;
      }
      .pr b {
        width: 64px;
        text-align: right;
      }
      .pb {
        flex: 1;
        height: 9px;
        background: #0008;
        border-radius: 5px;
        overflow: hidden;
        border: 1px solid #fff3;
      }
      .pb i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 5px;
      }
      #gap {
        text-align: center;
        font-size: 12px;
      }
      .hp + .hp,
      .bar {
        display: none;
      }
      .row3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        width: 100%;
        max-width: 620px;
      }
      .lvs {
        display: flex;
        gap: 6px;
        width: 100%;
        max-width: 620px;
      }
      .lvb {
        background: #1a2540;
        color: #e8f0ff;
        border: 2px solid #2a3550;
        padding: 8px 4px;
        font-size: 12px;
        width: auto;
        max-width: none;
        flex: 1;
      }
      .lvb.on {
        border-color: var(--c1);
        background: #12304a;
      }
      .alt {
        background: #2a3550;
        color: #e8f0ff;
      }
      .jn {
        display: flex;
        gap: 6px;
        flex: 1 1 220px;
      }
      .jn button {
        flex: 1;
      }
      #code {
        width: 92px;
        text-transform: uppercase;
        font-size: 18px;
        text-align: center;
        letter-spacing: 4px;
        border-radius: 10px;
        border: 2px solid #2a3550;
        background: #101a2e;
        color: #fff;
        padding: 6px;
      }
      #ov .note {
        font-size: 10px;
        opacity: 0.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>MATH RACER · ONLINE PVP</h1>
      <button id="snd" onclick="toggleSnd()" title="Suara">🔊</button>
      <div id="wrap">
        <canvas id="cv"></canvas>
        <div id="prog">
          <div class="pr">
            <span style="color: var(--c1)">KAMU</span>
            <div class="pb"><i id="pm" style="background: var(--c1)"></i></div>
            <b id="dm">0 m</b>
          </div>
          <div class="pr" id="rowo">
            <span style="color: var(--c2)">LAWAN</span>
            <div class="pb"><i id="po" style="background: var(--c2)"></i></div>
            <b id="do">0 m</b>
          </div>
          <div id="gap"></div>
        </div>
        <div id="hud">
          <div class="hp">
            <div class="bar" style="top: 6px">
              <i id="b0" style="background: var(--c1)"></i>
            </div>
            <div class="bar" style="top: 12px; height: 3px">
              <i id="o0" style="background: var(--c2)"></i>
            </div>
            <div class="q" id="q0" style="border-color: var(--c1)">-</div>
            <div class="ms" id="m0"></div>
            <div class="st">
              <span id="s0"></span
              ><span id="p0" style="color: var(--c1)">P1 · WASD</span>
            </div>
          </div>
          <div class="hp">
            <div class="bar" style="top: 6px">
              <i id="b1" style="background: var(--c2)"></i>
            </div>
            <div class="bar" style="top: 12px; height: 3px">
              <i id="o1" style="background: var(--c1)"></i>
            </div>
            <div class="q" id="q1" style="border-color: var(--c2)">-</div>
            <div class="ms" id="m1"></div>
            <div class="st">
              <span id="s1"></span
              ><span id="p1" style="color: var(--c2)">P2 · ←→↑↓</span>
            </div>
          </div>
        </div>
        <div id="cd"></div>
        <div id="ov"></div>
      </div>
      <div class="hint">
        Soal yang sama untuk kedua pemain · menang dengan skor tertinggi (teliti + cepat)!
      </div>
    </div>
    <script src="net.js"></script>
    <script>
      const GAP = 700,
        VMAX = 64, // m/s ≈ 230 km/h
        VNIT = 96, // m/s ≈ 345 km/h saat nitro
        // ---- aturan skor (dihitung lokal di tiap perangkat, bebas jeda jaringan)
        PTS_OK = 100, // poin tiap jawaban benar
        PTS_BAD = 50, // pengurang tiap jawaban salah (membuat asal tebak tidak menguntungkan)
        SPD_BONUS = 60, // bonus kecepatan maksimum, hanya untuk jawaban benar
        FAST_T = 9, // detik antar gerbang: <= ini dapat bonus penuh
        SLOW_T = 30, // detik antar gerbang: >= ini bonus 0
        NG = 10,
        FIN = GAP * NG + 200,
        LEN = FIN + 400,
        LW = 8,
        COL = ["#00e5ff", "#ffa500"],
        BC = [0x00c8ff, 0xff8c00],
        BD = ["#00b4ff", "#ffd400", "#ff4fa3"];
      const $ = (id) => document.getElementById(id);
      let RNG = Math.random;
      const r = (a, b) => a + Math.floor(RNG() * (b - a + 1)),
        pick = (a) => a[r(0, a.length - 1)];
      // ---- Generator soal aritmatika: + − × ÷ dengan urutan operasi biasa
      // Lv1 = 2 suku, Lv2 = 3 suku, Lv3 = 4 suku. Hasil selalu bilangan bulat >= 0.
      const NTERM = [2, 3, 4];
      const divisorsOf = (v) => {
        const d = [];
        for (let i = 2; i <= 12; i++) if (v % i === 0) d.push(i);
        return d;
      };
      function arithQ(n) {
        for (let tries = 0; tries < 200; tries++) {
          // pilih operator di antara suku-suku
          const ops = [];
          for (let i = 0; i < n - 1; i++) ops.push(pick(["+", "−", "×", "÷"]));
          // bagi menjadi kelompok tambah/kurang; tiap kelompok = rantai × ÷
          const groups = [];
          let cur = { sign: 1, ops: [] };
          groups.push(cur);
          ops.forEach((o) => {
            if (o === "+" || o === "−") {
              cur = { sign: o === "+" ? 1 : -1, ops: [] };
              groups.push(cur);
            } else cur.ops.push(o);
          });
          let total = 0,
            parts = [];
          groups.forEach((g, gi) => {
            const alone = g.ops.length === 0;
            let v = alone ? r(5, n === 2 ? 99 : 50) : r(2, 12);
            let txt = [String(v)];
            g.ops.forEach((o) => {
              if (o === "÷") {
                const d = divisorsOf(v);
                if (d.length) {
                  const b = pick(d);
                  v /= b;
                  txt.push("÷", String(b));
                  return;
                }
                o = "×"; // tidak bisa dibagi habis → ganti perkalian
              }
              const b = r(2, 9);
              v *= b;
              txt.push("×", String(b));
            });
            if (gi > 0) parts.push(g.sign > 0 ? "+" : "−");
            parts.push(txt.join(" "));
            total += g.sign * v;
          });
          if (total >= 0 && total <= 999) return [parts.join(" ") + " = ?", total];
        }
        return ["12 + 8 = ?", 20];
      }
      const gens = NTERM.map((n) => () => arithQ(n));
      // ---- 2D renderer (Canvas 2D, tanpa library)
      const DESIGNS = [
        {
          name: "Lamborghini",
          sub: "Wedge super rendah · lampu Y · sayap belakang",
          col: "#f2c200",
        },
        {
          name: "Porsche",
          sub: "Fastback klasik · lampu bulat · ekor bebek",
          col: "#b4bcc8",
        },
        {
          name: "Ferrari",
          sub: "Lekuk mulus · lampu belakang bulat ganda",
          col: "#d10a0a",
        },
      ];
      const SEL = [0, 1];
      let THUMBS = [];
      const cv = $("cv"),
        cx = cv.getContext("2d", { alpha: false });
      const VIEW_AHEAD = 80; // meter yang terlihat di depan mobil (kecil = terasa ngebut)
      let TOPY = 140; // batas atas area balap (di bawah kotak soal; disesuaikan tinggi kotak soal)
      let W = 600,
        H = 400,
        RX = 0,
        RW = 400,
        LP = 133,
        PXU = 2,
        CARY = 300;
      const hash = (n) => {
        const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return s - Math.floor(s);
      };
      const shade = (hex, k) => {
        const n = parseInt(hex.slice(1), 16),
          f = (v) => Math.max(0, Math.min(255, Math.round(v * k)));
        return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
      };
      const rr = (c, x, y, w, h, r) => {
        c.beginPath();
        if (c.roundRect) c.roundRect(x, y, w, h, r);
        else c.rect(x, y, w, h);
      };
      // Mobil dilihat dari atas, hidung ke atas, berpusat di (0,0). w = lebar, L = panjang.
      function drawCar(c, k, w, L, o) {
        o = o || {};
        const col = DESIGNS[k].col,
          hw = w / 2,
          hl = L / 2;
        // roda
        c.fillStyle = "#0b0b0e";
        const ww = w * 0.2,
          wl = L * 0.2;
        [-1, 1].forEach((sx) =>
          [-0.62, 0.6].forEach((fy) => {
            rr(c, sx * hw - ww / 2 - (sx > 0 ? -1 : 1), fy * hl - wl / 2, ww, wl, 3);
            c.fill();
          })
        );
        // bodi
        c.fillStyle = col;
        c.beginPath();
        if (k === 0) {
          // wedge: hidung runcing
          c.moveTo(0, -hl);
          c.lineTo(hw * 0.62, -hl * 0.72);
          c.lineTo(hw, -hl * 0.2);
          c.lineTo(hw * 0.96, hl * 0.78);
          c.lineTo(hw * 0.7, hl);
          c.lineTo(-hw * 0.7, hl);
          c.lineTo(-hw * 0.96, hl * 0.78);
          c.lineTo(-hw, -hl * 0.2);
          c.lineTo(-hw * 0.62, -hl * 0.72);
        } else if (k === 1) {
          // bulat klasik
          c.moveTo(0, -hl);
          c.bezierCurveTo(hw * 0.95, -hl, hw, -hl * 0.55, hw, -hl * 0.1);
          c.lineTo(hw, hl * 0.6);
          c.bezierCurveTo(hw, hl * 0.95, hw * 0.6, hl, 0, hl);
          c.bezierCurveTo(-hw * 0.6, hl, -hw, hl * 0.95, -hw, hl * 0.6);
          c.lineTo(-hw, -hl * 0.1);
          c.bezierCurveTo(-hw, -hl * 0.55, -hw * 0.95, -hl, 0, -hl);
        } else {
          // lekuk mulus
          c.moveTo(0, -hl);
          c.bezierCurveTo(hw * 0.7, -hl * 0.98, hw * 0.92, -hl * 0.6, hw * 0.95, -hl * 0.3);
          c.bezierCurveTo(hw * 1.05, 0, hw * 0.9, hl * 0.4, hw * 0.98, hl * 0.7);
          c.bezierCurveTo(hw * 0.95, hl * 0.95, hw * 0.5, hl, 0, hl);
          c.bezierCurveTo(-hw * 0.5, hl, -hw * 0.95, hl * 0.95, -hw * 0.98, hl * 0.7);
          c.bezierCurveTo(-hw * 0.9, hl * 0.4, -hw * 1.05, 0, -hw * 0.95, -hl * 0.3);
          c.bezierCurveTo(-hw * 0.92, -hl * 0.6, -hw * 0.7, -hl * 0.98, 0, -hl);
        }
        c.closePath();
        c.fill();
        // sisi lebih gelap
        c.fillStyle = shade(col, 0.72);
        rr(c, -hw * 0.98, -hl * 0.1, hw * 0.2, hl * 0.9, 3);
        c.fill();
        rr(c, hw * 0.78, -hl * 0.1, hw * 0.2, hl * 0.9, 3);
        c.fill();
        // garis balap
        if (k === 2) {
          c.fillStyle = "#f4f4f4";
          c.fillRect(-w * 0.06, -hl, w * 0.12, L);
        } else if (k === 0) {
          c.fillStyle = shade(col, 0.82);
          c.fillRect(-w * 0.05, -hl * 0.95, w * 0.1, hl * 0.6);
        }
        // kaca
        c.fillStyle = "#0a1424";
        c.beginPath();
        c.moveTo(-hw * 0.66, -hl * 0.1);
        c.lineTo(hw * 0.66, -hl * 0.1);
        c.lineTo(hw * 0.58, hl * 0.32);
        c.lineTo(-hw * 0.58, hl * 0.32);
        c.closePath();
        c.fill();
        c.fillStyle = "#16294a";
        c.fillRect(-hw * 0.5, hl * 0.1, hw, hl * 0.16);
        // atap
        c.fillStyle = shade(col, 1.08);
        rr(c, -hw * 0.52, hl * 0.04, hw * 1.04, hl * 0.4, 6);
        c.fill();
        // lampu depan
        c.fillStyle = "#fffbe0";
        if (k === 0) {
          [-1, 1].forEach((s) => {
            c.beginPath();
            c.moveTo(s * hw * 0.22, -hl * 0.86);
            c.lineTo(s * hw * 0.62, -hl * 0.7);
            c.lineTo(s * hw * 0.55, -hl * 0.62);
            c.lineTo(s * hw * 0.18, -hl * 0.76);
            c.fill();
          });
        } else {
          [-1, 1].forEach((s) => {
            c.beginPath();
            c.arc(s * hw * 0.6, -hl * 0.74, w * (k === 1 ? 0.11 : 0.085), 0, 7);
            c.fill();
          });
        }
        // sayap / ekor
        if (k === 0) {
          c.fillStyle = "#15151a";
          c.fillRect(-hw * 0.95, hl * 0.82, w * 0.95, hl * 0.14);
        } else if (k === 1) {
          c.fillStyle = shade(col, 0.6);
          rr(c, -hw * 0.7, hl * 0.78, hw * 1.4, hl * 0.1, 3);
          c.fill();
        }
        // lampu belakang
        c.fillStyle = o.brake ? "#ff3040" : "#8a1018";
        if (k === 2) {
          [-1, 1].forEach((s) =>
            [0.35, 0.72].forEach((f) => {
              c.beginPath();
              c.arc(s * hw * f, hl * 0.93, w * 0.06, 0, 7);
              c.fill();
            })
          );
        } else {
          c.fillRect(-hw * 0.82, hl * 0.93, hw * 0.55, hl * 0.06);
          c.fillRect(hw * 0.27, hl * 0.93, hw * 0.55, hl * 0.06);
        }
        // sorot rem
        if (o.brake) {
          c.fillStyle = "rgba(255,40,60,.35)";
          c.fillRect(-hw, hl, w, L * 0.12);
        }
      }
      function drawFlame(c, w, L, t) {
        const hl = L / 2,
          len = L * (0.55 + Math.random() * 0.45);
        [-0.3, 0.3].forEach((s) => {
          const x = s * w;
          const g = c.createLinearGradient(0, hl, 0, hl + len);
          g.addColorStop(0, "#fff6b0");
          g.addColorStop(0.35, "#ffb020");
          g.addColorStop(1, "rgba(255,70,0,0)");
          c.fillStyle = g;
          c.beginPath();
          c.moveTo(x - w * 0.13, hl);
          c.lineTo(x + w * 0.13, hl);
          c.lineTo(x, hl + len);
          c.closePath();
          c.fill();
        });
      }
      function fitTop(noReflow) {

        audio();
        phase = "wait";
        oppId = null;
        ROUND = 0;
        showWait("Menghubungkan…");
        try {
          const r = await RM.join(CODE, ROLE);
          ROOM = r;
          CODE = r.code;
          r.onPeers(onPeers);
          r.onClose(() => {
            if (ROOM !== r) return;
            ROOM = null;
            if (!run) {
              phase = "wait";
              showWait("Room sudah ditutup atau koneksi terputus.");
            }
          });
          await r.presence({ role: ROLE, car: SEL[0], round: 0 });
          showWait();
          onPeers();
        } catch (e) {
          ROOM = null;
          ROLE = "";
          showWait((e && e.message) || "Gagal terhubung, coba lagi.");
        }
      }
      function oppPeer() {
        if (!ROOM) return null;
        const ps = ROOM.peers();
        return ROLE === "host"
          ? ps.find((p) => p.peer === oppId)
          : ps.find((p) => !p.isMe && p.presence.role === "host");
      }
      function onPeers() {
        if (!ROOM) return;
        const ps = ROOM.peers();
        if (ROLE === "host") {
          if (oppId && !run && !ps.some((p) => p.peer === oppId)) {
            oppId = null;
            if (phase === "wait") showWait();
          }
          if (!oppId) {
            const g = ps.find((p) => !p.isMe && p.presence.role === "guest");
            if (g) {
              oppId = g.peer;
              ROOM.presence({ opp: oppId }).catch(() => {});
              if (phase === "wait") {
                showWait("Lawan terhubung! Balapan dimulai sebentar lagi…");
                setTimeout(beginRound, 1500);
              }
            }
          }
        } else {
          const h = ps.find((p) => !p.isMe && p.presence.role === "host"),
            m = ps.find((p) => p.isMe && p.sameTab);
          if (!h || !m) {
            return;
          }
          if (phase === "wait") ROOM.hot(true);
          const pr = h.presence;
          if (
            pr.opp === m.peer &&
            pr.round > ROUND &&
            !run &&
            (phase === "wait" || phase === "done")
          ) {
            ROUND = pr.round;
            startRace(pr.seed, pr.lvl);
          } else if (phase === "wait")
            showWait(
              pr.opp && pr.opp !== m.peer
                ? "Room sudah penuh (host sedang bermain dengan orang lain)."
                : "Host ditemukan ✔ Menunggu host memulai…"
            );
        }
      }
      function beginRound() {
        if (!ROOM || ROLE !== "host" || !oppId || run || phase === "starting") return;
        ROUND++;
        const seed = Math.floor(Math.random() * 1e9);
        ROOM.hot(true);
        phase = "starting";
        ROOM.presence({
          round: ROUND,
          seed,
          lvl: LVL,
          opp: oppId,
          d: 0,
          sp: 0,
          gi: 0,
          ok: 0,
          sc: 0,
          ft: null,
          car: SEL[0],
        }).catch(() => {});
        const r = ROOM,
          rd = ROUND;
        // beri waktu sebentar agar perangkat lawan menerima ronde baru sebelum hitung mundur
        setTimeout(() => {
          if (ROOM === r && ROUND === rd) startRace(seed, LVL);
        }, 600);
      }
      function rematch() {
        beginRound();
      }
      function soloStart() {
        ROLE = "solo";
        audio();
        startRace(Math.floor(Math.random() * 1e9), LVL);
      }
      function leaveRoom() {
        run = false;
        silence();
        $("cd").textContent = "";
        if (ROOM) {
          ROOM.leave().catch(() => {});
          ROOM = null;
        }
        ROLE = "";
        oppId = null;
        menu();
      }
      // ---- race
      function startRace(seed, l) {
        if (run) return;
        lvl = l;
        audio();
        RNG = mulberry(seed);
        Q = Array.from({ length: NG }, mkQ);
        RNG = Math.random;
        me = mk();
        oppFinal = null;
        lastSent = "";
        lastWg = "";
        T = 0;
        cd = 3;
        cdn = 4;
        goT = 0;
        $("cd").textContent = "";
        $("p0").textContent = "WASD · " + DESIGNS[SEL[0]].name;
        $("rowo").style.display = "none"; // lawan tidak terlihat
        $("ov").style.display = "none";
        phase = "race";
        run = true;
        last = performance.now();
        lastNet = 0;
        lastSeen = last;
        showQ();
        if (ROOM && ROLE !== "solo") ROOM.hot(false); // posisi lawan tidak dipakai, cukup polling santai
        if (ROOM && ROLE !== "solo")
          ROOM.presence({
            round: ROUND,
            gi: 0,
            ok: 0,
            sc: 0,
            ft: null,
            car: SEL[0],
          }).catch(() => {});
        requestAnimationFrame(loop);
      }
      function showQ() {
        $("q0").textContent = me.gi < NG ? Q[me.gi].t : "Menuju finish! 🏁";
        fitTop();
      }
      function mv(n) {
        if (run && cd <= 0) {
          const l = Math.max(0, Math.min(2, n));
          if (l !== me.lane) SFX.sw(-1);
          me.lane = l;
        }
      }
      addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (run && k.startsWith("arrow")) e.preventDefault();
        K[k] = 1;
        if (!run || cd > 0) return;
        if (k === "a" || k === "arrowleft") mv(me.lane - 1);
        if (k === "d" || k === "arrowright") mv(me.lane + 1);
      });
      addEventListener("keyup", (e) => {
        K[e.key.toLowerCase()] = 0;
      });
      const tap = (e) => {
        if (!run) return;
        const b = cv.getBoundingClientRect();
        mv(Math.floor(((e.clientX - b.left - RX) / RW) * 3));
      };
      cv.addEventListener("pointerdown", tap);
      cv.addEventListener("pointermove", (e) => {
        if (e.buttons) tap(e);
      });
      function loop(n) {
        if (!run) return;
        const dt = Math.min((n - last) / 1000, 0.05);
        last = n;
        upd(dt);
        net(n);
        check(n);
        if (run) frame(dt);
        requestAnimationFrame(loop);
      }
      function upd(dt) {
        if (cd > 0) {
          cd -= dt;
          const n = Math.ceil(cd);
          if (n > 0 && n !== cdn) {
            cdn = n;
            cdShow(n, "#ffd400");
            SFX.count();
          }
          if (cd <= 0) {
            cdShow("GO!", "#3dff7a");
            SFX.go();
            goT = 0.9;
          }
          return;
        }
        if (goT > 0) {
          goT -= dt;
          if (goT <= 0) $("cd").textContent = "";
        }
        T += dt;
        const p = me,
          fin = p.t !== null,
          g = !fin && (K.w || K.arrowup),
          b = !fin && (K.s || K.arrowdown);
        p.lx += (p.lane - p.lx) * Math.min(1, dt * 13);
        p.brp = p.br;
        p.br = false;
        p.nit = Math.max(0, p.nit - dt);
        if (g && !b) {
          // tenaga mesin menurun mendekati kecepatan maksimum
          p.sp +=
            (p.sp < 0 ? 34 : 22) *
            Math.max(0.05, 1 - Math.max(0, p.sp) / VMAX) *
            dt;
        } else if (b) {
          if (!p.brp && p.sp > 24) SFX.skid(-1);
          p.br = true;
          p.sp -= (p.sp > 0 ? 50 : 10) * dt;
        } else
          p.sp -=
            Math.sign(p.sp) *
            Math.min(Math.abs(p.sp), (3 + Math.abs(p.sp) * 0.11) * dt);
        if (p.nit > 0 && !b)
          p.sp += 60 * Math.max(0, 1 - p.sp / VNIT) * dt; // dorongan nitro
        const top = p.nit > 0 ? VNIT : VMAX;
        if (p.sp > top) p.sp -= Math.min(p.sp - top, 22 * dt);
        if (p.sp < -12) p.sp = -12;
        if (fin) {
          p.nit = 0;
          p.sp = Math.max(0, p.sp - 34 * dt); // mobil berhenti perlahan setelah finish
        }
        const o = p.d;
        p.d = Math.max(0, p.d + p.sp * dt);
        if (p.d === 0 && p.sp < 0) p.sp = 0;
        p.ds = p.d - o;
        p.mt -= dt;
        if (p.gi < NG && p.d >= (p.gi + 1) * GAP) {
          const q = Q[p.gi];
          if (p.lane === q.cl) {
            p.nit = 2.4;
            p.sp = Math.min(VNIT, p.sp + 16);
            p.st++;
            p.ok++;
            const seg = T - p.gT,
              bonus = Math.round(
                SPD_BONUS * Math.max(0, Math.min(1, (SLOW_T - seg) / (SLOW_T - FAST_T)))
              );
            p.sc += PTS_OK + bonus;
            p.msg = "NITRO! 🔥 +" + (PTS_OK + bonus);
            p.mc = COL[0];
            SFX.ok(-1);
            SFX.nitro(-1);
          } else {
            SFX.bad(-1);
            p.nit = 0;
            p.sp = Math.min(p.sp, 10);
            p.st = 0;
            p.sc -= PTS_BAD;
            p.msg = "Salah! −" + PTS_BAD + " · jawaban " + q.o[q.cl];
            p.mc = "#ff5577";
          }
          p.mt = 1.5;
          p.gT = T;
          p.gi++;
          showQ();
        }
        if (p.d >= FIN && p.t === null) p.t = T;
      }
      // Pemenang: skor tertinggi (benar +100 & bonus cepat, salah -50). Seri skor: jawaban benar
      // terbanyak, lalu waktu tercepat; selisih waktu < 0,05 dtk = seri.
      function judge(a, b) {
        if (a.sc !== b.sc) return a.sc > b.sc ? "win" : "lose";
        if (a.ok !== b.ok) return a.ok > b.ok ? "win" : "lose";
        if (Math.abs(a.t - b.t) < 0.05) return "draw";
        return a.t < b.t ? "win" : "lose";
      }
      // Kirim hanya data yang berubah (per gerbang & saat finish), bukan posisi tiap frame.
      function net(n) {
        if (!ROOM || ROLE === "solo" || n - lastNet < 200) return;
        lastNet = n;
        const k = me.gi + "|" + me.ok + "|" + me.sc + "|" + (me.t === null ? "" : me.t);
        if (k === lastSent) return;
        lastSent = k;
        ROOM.presence({
          round: ROUND,
          gi: me.gi,
          ok: me.ok,
          sc: me.sc,
          ft: me.t,
        }).catch(() => {});
      }
      function showFinishWait(pr) {
        const gi = pr && pr.gi != null ? pr.gi : 0,
          txt = `Lawan sudah menjawab ${gi}/${NG} soal…`;
        if (!$("wg")) {
          lastWg = "";
          $("ov").style.display = "flex";
          $("ov").innerHTML = `<div class="in"><div style="font-size:38px">🏁</div><h3>KAMU SUDAH FINISH!</h3><p>Skor kamu: <b>${me.sc}</b> · Benar ${me.ok}/${NG} · Waktu ${me.t.toFixed(1)} detik<br><span id="wg"></span></p><p>Pemenang = skor tertinggi (benar + cepat, salah dikurangi).</p><button class="alt" onclick="leaveRoom()">Keluar ke menu</button></div>`;
        }
        if (txt !== lastWg) {
          lastWg = txt;
          $("wg").textContent = "Menunggu lawan menyelesaikan balapan. " + txt;
        }
      }
      function check(n) {
        if (ROLE === "solo") {
          if (me.t !== null) finish("win");
          return;
        }
        const pe = oppPeer(),
          pr = pe && pe.presence.round === ROUND ? pe.presence : null;
        if (pr && pr.ft != null) oppFinal = { ok: pr.ok || 0, sc: pr.sc || 0, t: pr.ft };
        if (pe) lastSeen = n;
        else if (!oppFinal && n - lastSeen > 4000)
          return finish("win", "Lawan keluar dari room.");
        if (me.t === null) return; // lawan selesai duluan? tetap lanjutkan balapanmu
        if (!me.tAt) me.tAt = n;
        if (oppFinal) return finish(judge({ ok: me.ok, sc: me.sc, t: me.t }, oppFinal));
        if (n - me.tAt > 90000) {
          const o = pr ? pr.sc || 0 : 0;
          return finish(me.sc >= o ? "win" : "lose", "Lawan terlalu lama menyelesaikan balapan.");
        }
        showFinishWait(pr);
      }
      function finish(res, msg) {
        if (!run) return;
        run = false;
        phase = "done";
        if (ROOM && ROLE !== "solo")
          ROOM.presence({ gi: me.gi, ok: me.ok, sc: me.sc, ft: me.t }).catch(() => {});
        if (ROOM && ROLE !== "solo") ROOM.hot(false);
        const win = res === "win",
          draw = res === "draw",
          o2 = oppFinal;
        if (win || draw) SFX.fin();
        else SFX.bad(-1);
        silence();
        const o = $("ov"),
          icon = win ? "🏆" : draw ? "🤝" : "💥",
          col = win ? "#3dff7a" : draw ? "#ffd400" : "#ff5577",
          title = win ? "KAMU MENANG!" : draw ? "SERI!" : "KAMU KALAH",
          tie = o2 && me.t !== null && me.sc === o2.sc;
        o.style.display = "flex";
        o.innerHTML =
          `<div class="in"><div style="font-size:42px">${icon}</div><h2 style="margin:0;color:${col}">${title}</h2><p>${
            msg ? msg + "<br>" : ""
          }Skor: kamu <b>${me.sc}</b>${
            ROLE === "solo" || !o2 ? "" : ` · lawan <b>${o2.sc}</b>`
          }<br>Jawaban benar: ${me.ok}/${NG}${
            ROLE === "solo" || !o2 ? "" : ` · lawan ${o2.ok}/${NG}`
          }${
            me.t !== null ? `<br>Waktumu: ${me.t.toFixed(1)} detik${o2 ? ` · lawan ${o2.t.toFixed(1)} detik` : ""}` : ""
          }${
            tie ? "<br>Skor sama, jadi jawaban benar terbanyak lalu waktu tercepat yang menentukan." : ""
          }</p>` +
          (ROLE === "guest"
            ? "<p>Menunggu host memulai ulang…</p>"
            : ROLE === "host"
            ? '<button onclick="rematch()">Main lagi</button>'
            : '<button onclick="soloStart()">Main lagi</button>') +
          '<button class="alt" onclick="leaveRoom()">Keluar ke menu</button></div>';
      }
      const HC = {};
      const setT = (id, v) => {
        if (HC[id] !== v) {
          HC[id] = v;
          $(id).textContent = v;
        }
      };
      const setW = (id, v) => {
        if (HC[id] !== v) {
          HC[id] = v;
          $(id).style.width = v;
        }
      };
      function hud() {
        const p = me,
          solo = ROLE === "solo";
        setW("pm", Math.round(Math.min(100, (p.d / FIN) * 100) * 10) / 10 + "%");
        setT("dm", Math.round(Math.min(p.d, FIN)) + " m");
        setT(
          "s0",
          `${p.sp < -0.3 ? "R " : ""}${Math.round(
            Math.abs(p.sp) * 3.6
          )} km/h · Skor ${p.sc} · 🔥${p.st} · ${Math.min(p.gi + 1, NG)}/${NG}`
        );
        setT("m0", p.mt > 0 ? p.msg : "");
        if (HC.mc !== p.mc) {
          HC.mc = p.mc;
          $("m0").style.color = p.mc;
        }
      }
      function frame(dt = 0) {
        const p = me;
        drawScene(p.d, p.lx, p.lane, p.sp, p.br);
        hud();
        engine();
      }
      function resize() {
        layout();
        sizeCanvas();
        fitTop();
        render();
      }
      addEventListener("resize", resize);
      addEventListener("pagehide", () => {
        if (ROOM && ROOM.beacon) ROOM.beacon();
      });
      layout();
      sizeCanvas();
      THUMBS = makeThumbs();
      resize();
      menu();
      (async () => {
        try {
          RM = window.MRNet ? window.MRNet.makeRM() : null;
        } catch (e) {
          RM = null;
        }
        if (phase === "menu") menu();
      })();
    </script>
  </body>
</html>
