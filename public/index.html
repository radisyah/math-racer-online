<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Math Racer 3D Online</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8F%8E%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #0b0f1a;
        --fg: #e8f0ff;
        --c1: #00e5ff;
        --c2: #ffa500;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, Segoe UI, Arial, sans-serif;
        display: flex;
        justify-content: center;
      }
      #app {
        width: 100%;
        max-width: 980px;
        padding: 8px;
      }
      h1 {
        font-size: 17px;
        margin: 2px 0 6px;
        letter-spacing: 2px;
        text-align: center;
      }
      #wrap {
        position: relative;
        border-radius: 10px;
        overflow: hidden;
        background: #000;
        margin: 0 auto;
      }
      canvas {
        display: block;
      }
      #hud {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr;
        pointer-events: none;
      }
      .hp {
        position: relative;
        border-left: 1px solid #000;
      }
      .q {
        position: absolute;
        top: 64px;
        left: 6px;
        right: 6px;
        background: #0b0f1acc;
        border: 2px solid;
        border-radius: 8px;
        padding: 4px;
        text-align: center;
        font-size: clamp(11px, 2vw, 16px);
        font-weight: 700;
      }
      .bar {
        position: absolute;
        left: 6px;
        right: 6px;
        height: 5px;
        background: #0008;
        border-radius: 3px;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 3px;
      }
      .st {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 6px;
        display: flex;
        justify-content: space-between;
        font-size: clamp(11px, 2vw, 15px);
        font-weight: 700;
        text-shadow: 0 1px 3px #000;
      }
      .ms {
        position: absolute;
        left: 0;
        right: 0;
        top: 42%;
        text-align: center;
        font-size: clamp(18px, 4vw, 30px);
        font-weight: 800;
        text-shadow: 0 2px 6px #000;
      }
      #ov {
        position: absolute;
        inset: 0;
        background: rgba(5, 8, 16, 0.93);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px;
        text-align: center;
        z-index: 5;
        overflow: auto;
      }
      #ov p {
        margin: 0;
        font-size: 13px;
        opacity: 0.88;
        max-width: 440px;
      }
      button {
        background: #00e5ff;
        color: #001018;
        border: 0;
        border-radius: 10px;
        padding: 11px 16px;
        font-size: 15px;
        font-weight: 700;
        width: 100%;
        max-width: 260px;
        cursor: pointer;
      }
      .hint {
        font-size: 11px;
        opacity: 0.6;
        text-align: center;
        margin-top: 6px;
      }
      #ov .in {
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        width: 100%;
      }
      #ov h3 {
        margin: 2px 0 0;
        font-size: 14px;
        letter-spacing: 1px;
      }
      #ov details {
        max-width: 480px;
        font-size: 12px;
        opacity: 0.88;
      }
      #ov summary {
        cursor: pointer;
        opacity: 0.8;
      }
      .row {
        display: grid;
        grid-template-columns: 30px repeat(3, 1fr);
        gap: 6px;
        width: 100%;
        max-width: 620px;
        align-items: stretch;
      }
      .row > b {
        align-self: center;
        font-size: 14px;
      }
      .card {
        background: #101a2e;
        border: 2px solid #2a3550;
        border-radius: 10px;
        padding: 4px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 1px;
        font-size: 12px;
        font-weight: 700;
        user-select: none;
        -webkit-user-select: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .card img {
        width: 100%;
        display: block;
        border-radius: 6px;
        pointer-events: none;
      }
      .card small {
        font-size: 9.5px;
        font-weight: 400;
        opacity: 0.7;
        line-height: 1.25;
      }
      .card.on {
        border-color: var(--c);
        box-shadow: 0 0 12px var(--c);
      }
      .lv {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
        max-width: 620px;
        margin-top: 2px;
      }
      .lv button {
        flex: 1 1 150px;
        max-width: none;
        width: auto;
      }
      #app {
        position: relative;
      }
      #snd {
        position: absolute;
        top: 2px;
        right: 8px;
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 50%;
        font-size: 15px;
        background: #0b0f1acc;
        color: #fff;
        border: 1px solid #fff4;
        z-index: 6;
      }
      #cd {
        position: absolute;
        left: 0;
        right: 0;
        top: 30%;
        text-align: center;
        font-size: clamp(64px, 16vw, 150px);
        font-weight: 900;
        line-height: 1;
        pointer-events: none;
        z-index: 4;
        text-shadow: 0 4px 18px #000, 0 0 30px currentColor;
        animation: none;
      }
      #cd.pop {
        animation: pop 0.9s ease-out;
      }
      @keyframes pop {
        0% {
          transform: scale(1.7);
          opacity: 0;
        }
        25% {
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 0.95;
        }
      }
      #prog {
        position: absolute;
        left: 8px;
        right: 8px;
        top: 6px;
        z-index: 3;
        display: flex;
        flex-direction: column;
        gap: 3px;
        pointer-events: none;
        font-size: clamp(10px, 1.8vw, 13px);
        font-weight: 700;
        text-shadow: 0 1px 3px #000;
      }
      .pr {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .pr span {
        width: 50px;
      }
      .pr b {
        width: 64px;
        text-align: right;
      }
      .pb {
        flex: 1;
        height: 9px;
        background: #0008;
        border-radius: 5px;
        overflow: hidden;
        border: 1px solid #fff3;
      }
      .pb i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 5px;
      }
      #gap {
        text-align: center;
        font-size: 12px;
      }
      .hp + .hp,
      .bar {
        display: none;
      }
      .row3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        width: 100%;
        max-width: 620px;
      }
      .lvs {
        display: flex;
        gap: 6px;
        width: 100%;
        max-width: 620px;
      }
      .lvb {
        background: #1a2540;
        color: #e8f0ff;
        border: 2px solid #2a3550;
        padding: 8px 4px;
        font-size: 12px;
        width: auto;
        max-width: none;
        flex: 1;
      }
      .lvb.on {
        border-color: var(--c1);
        background: #12304a;
      }
      .alt {
        background: #2a3550;
        color: #e8f0ff;
      }
      .jn {
        display: flex;
        gap: 6px;
        flex: 1 1 220px;
      }
      .jn button {
        flex: 1;
      }
      #code {
        width: 92px;
        text-transform: uppercase;
        font-size: 18px;
        text-align: center;
        letter-spacing: 4px;
        border-radius: 10px;
        border: 2px solid #2a3550;
        background: #101a2e;
        color: #fff;
        padding: 6px;
      }
      #ov .note {
        font-size: 10px;
        opacity: 0.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>MATH RACER 3D · ONLINE PVP</h1>
      <button id="snd" onclick="toggleSnd()" title="Suara">🔊</button>
      <div id="wrap">
        <canvas id="cv"></canvas>
        <div id="prog">
          <div class="pr">
            <span style="color: var(--c1)">KAMU</span>
            <div class="pb"><i id="pm" style="background: var(--c1)"></i></div>
            <b id="dm">0 m</b>
          </div>
          <div class="pr" id="rowo">
            <span style="color: var(--c2)">LAWAN</span>
            <div class="pb"><i id="po" style="background: var(--c2)"></i></div>
            <b id="do">0 m</b>
          </div>
          <div id="gap"></div>
        </div>
        <div id="hud">
          <div class="hp">
            <div class="bar" style="top: 6px">
              <i id="b0" style="background: var(--c1)"></i>
            </div>
            <div class="bar" style="top: 12px; height: 3px">
              <i id="o0" style="background: var(--c2)"></i>
            </div>
            <div class="q" id="q0" style="border-color: var(--c1)">-</div>
            <div class="ms" id="m0"></div>
            <div class="st">
              <span id="s0"></span
              ><span id="p0" style="color: var(--c1)">P1 · WASD</span>
            </div>
          </div>
          <div class="hp">
            <div class="bar" style="top: 6px">
              <i id="b1" style="background: var(--c2)"></i>
            </div>
            <div class="bar" style="top: 12px; height: 3px">
              <i id="o1" style="background: var(--c1)"></i>
            </div>
            <div class="q" id="q1" style="border-color: var(--c2)">-</div>
            <div class="ms" id="m1"></div>
            <div class="st">
              <span id="s1"></span
              ><span id="p1" style="color: var(--c2)">P2 · ←→↑↓</span>
            </div>
          </div>
        </div>
        <div id="cd"></div>
        <div id="ov"></div>
      </div>
      <div class="hint">
        Soal yang sama untuk kedua pemain · adu cepat dan teliti!
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="net.js"></script>
    <script>
      const GAP = 400,
        NG = 10,
        FIN = GAP * NG + 200,
        LEN = FIN + 400,
        LW = 8,
        COL = ["#00e5ff", "#ffa500"],
        BC = [0x00c8ff, 0xff8c00],
        BD = ["#00b4ff", "#ffd400", "#ff4fa3"];
      const $ = (id) => document.getElementById(id);
      let RNG = Math.random;
      const r = (a, b) => a + Math.floor(RNG() * (b - a + 1)),
        pick = (a) => a[r(0, a.length - 1)];
      const gens = [
        () =>
          pick([
            () => {
              let a = r(3, 12),
                b = r(3, 12);
              return [`${a} × ${b} = ?`, a * b];
            },
            () => {
              let p = pick([10, 20, 25, 50]),
                n = r(1, 10) * 20;
              return [`${p}% dari ${n} = ?`, (n * p) / 100];
            },
            () => {
              let a = r(2, 15),
                b = r(a + 1, 25);
              return [`−${b} + ${a} = ?`, a - b];
            },
            () => {
              let a = r(2, 9),
                b = r(2, 9);
              return [`${a} × (−${b}) = ?`, -a * b];
            },
          ])(),
        () =>
          pick([
            () => {
              let v = r(2, 12),
                a = r(2, 6),
                b = r(1, 15);
              return [`${a}x + ${b} = ${a * v + b} → x = ?`, v];
            },
            () => {
              let t = pick([
                [3, 4, 5],
                [5, 12, 13],
                [8, 15, 17],
                [6, 8, 10],
              ]);
              return [`Sisi tegak ${t[0]} & ${t[1]}, sisi miring = ?`, t[2]];
            },
            () => {
              let n = r(3, 7);
              return [`2^${n} = ?`, 2 ** n];
            },
            () => {
              let n = r(4, 15);
              return [`√${n * n} = ?`, n];
            },
          ])(),
        () =>
          pick([
            () => {
              let n = r(3, 6);
              return [`²log ${2 ** n} = ?`, n];
            },
            () => {
              let a = r(2, 5),
                b = r(2, 6);
              return [`f(x)=${a}x², f'(${b}) = ?`, 2 * a * b];
            },
            () => {
              let n = r(5, 12);
              return [`Suku ke-${n} barisan 3, 7, 11, … = ?`, 3 + 4 * (n - 1)];
            },
            () => {
              let k = r(2, 9) * 2;
              return [`sin 30° × ${k * 2} = ?`, k];
            },
            () => {
              let a = r(2, 9),
                d = r(2, 5);
              return [`Rata-rata ${a}, ${a + d}, ${a + 2 * d} = ?`, a + d];
            },
          ])(),
      ];
      // ---- 3D setup
      const cv = $("cv"),
        R = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
      R.setPixelRatio(Math.min(devicePixelRatio, 2));
      R.setScissorTest(true);
      R.shadowMap.enabled = true;
      R.shadowMap.type = THREE.PCFSoftShadowMap;
      R.outputEncoding = THREE.sRGBEncoding;
      R.toneMapping = THREE.ACESFilmicToneMapping;
      R.toneMappingExposure = 1.05;
      const sc = new THREE.Scene(),
        SKY = 0xcfe4f5;
      sc.fog = new THREE.Fog(SKY, 90, 540);
      const enc = (T) => {
        T.encoding = THREE.sRGBEncoding;
        T.anisotropy = 8;
        return T;
      };
      const hemi = new THREE.HemisphereLight(0xcfe4ff, 0x4a5a3a, 0.55);
      sc.add(hemi);
      const sun = new THREE.DirectionalLight(0xfff1d6, 1.9);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      const sh = sun.shadow.camera;
      sh.left = -45;
      sh.right = 45;
      sh.top = 45;
      sh.bottom = -45;
      sh.near = 1;
      sh.far = 220;
      sun.shadow.bias = -0.0004;
      sun.shadow.normalBias = 0.05;
      sc.add(sun, sun.target);
      const cams = [0, 1].map(
        () => new THREE.PerspectiveCamera(60, 1, 0.5, 700)
      );
      // sky dome + environment reflections
      const skyC = document.createElement("canvas");
      skyC.width = 4;
      skyC.height = 256;
      {
        const g = skyC.getContext("2d"),
          gr = g.createLinearGradient(0, 0, 0, 256);
        gr.addColorStop(0, "#3f7fd0");
        gr.addColorStop(0.45, "#9cc6ee");
        gr.addColorStop(0.5, "#dcebf7");
        gr.addColorStop(0.52, "#6f8a62");
        gr.addColorStop(1, "#4a5d3e");
        g.fillStyle = gr;
        g.fillRect(0, 0, 4, 256);
      }
      const skyM = new THREE.MeshBasicMaterial({
        map: enc(new THREE.CanvasTexture(skyC)),
        side: THREE.BackSide,
        fog: false,
        depthWrite: false,
      });
      const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 24, 16), skyM);
      sky.renderOrder = -1;
      sc.add(sky);
      {
        const es = new THREE.Scene();
        es.add(
          new THREE.Mesh(new THREE.SphereGeometry(100, 24, 16), skyM.clone())
        );
        const sn = new THREE.Mesh(
          new THREE.SphereGeometry(12, 12, 8),
          new THREE.MeshBasicMaterial({ color: 0xfff3d0 })
        );
        sn.position.set(-60, 70, 40);
        es.add(sn);
        const pm = new THREE.PMREMGenerator(R);
        sc.environment = pm.fromScene(es).texture;
      }
      function tex(t, w, h, bg, fg, fs, bd) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        const g = c.getContext("2d");
        g.fillStyle = bg;
        g.fillRect(0, 0, w, h);
        g.strokeStyle = bd;
        g.lineWidth = 12;
        g.strokeRect(6, 6, w - 12, h - 12);
        g.fillStyle = fg;
        g.textAlign = "center";
        g.textBaseline = "middle";
        let s = fs;
        g.font = `bold ${s}px system-ui,sans-serif`;
        while (g.measureText(t).width > w - 50 && s > 20) {
          s -= 4;
          g.font = `bold ${s}px system-ui,sans-serif`;
        }
        g.fillText(t, w / 2, h / 2 + 4);
        return enc(new THREE.CanvasTexture(c));
      }
      function board(w, h, t, tw, th, fs, bd) {
        const dk = new THREE.MeshStandardMaterial({
            color: 0x222831,
            roughness: 0.6,
            metalness: 0.4,
          }),
          m = new THREE.MeshBasicMaterial({
            map: tex(t, tw, th, "#0d2b4a", "#fff", fs, bd),
          });
        const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.5), [
          dk,
          dk,
          dk,
          dk,
          m,
          dk,
        ]);
        o.castShadow = true;
        return o;
      }
      // road & scenery
      {
        const c = document.createElement("canvas");
        c.width = 192;
        c.height = 128;
        const g = c.getContext("2d");
        g.fillStyle = "#3a3d44";
        g.fillRect(0, 0, 192, 128);
        for (let i = 0; i < 5000; i++) {
          g.fillStyle = `rgba(${r(0, 1) ? 255 : 0},${r(0, 1) ? 255 : 0},${
            r(0, 1) ? 255 : 0
          },.07)`;
          g.fillRect(r(0, 191), r(0, 127), 1, 1);
        }
        g.fillStyle = "#f2f2f2";
        g.fillRect(4, 0, 4, 128);
        g.fillRect(184, 0, 4, 128);
        for (const x of [63, 127]) g.fillRect(x, 0, 3, 48);
        const T = enc(new THREE.CanvasTexture(c));
        T.wrapT = THREE.RepeatWrapping;
        T.repeat.set(1, LEN / 16);
        const road = new THREE.Mesh(
          new THREE.PlaneGeometry(24, LEN),
          new THREE.MeshStandardMaterial({
            map: T,
            roughness: 0.85,
            envMapIntensity: 0.3,
          })
        );
        road.rotation.x = -Math.PI / 2;
        road.position.z = -LEN / 2 + 60;
        road.receiveShadow = true;
        sc.add(road);
        const gc = document.createElement("canvas");
        gc.width = gc.height = 128;
        const gg = gc.getContext("2d");
        gg.fillStyle = "#4a8a3e";
        gg.fillRect(0, 0, 128, 128);
        for (let i = 0; i < 3000; i++) {
          gg.fillStyle = `rgba(${r(20, 90)},${r(110, 180)},${r(30, 70)},.35)`;
          gg.fillRect(r(0, 127), r(0, 127), 2, 2);
        }
        const GT = enc(new THREE.CanvasTexture(gc));
        GT.wrapS = GT.wrapT = THREE.RepeatWrapping;
        GT.repeat.set(60, LEN / 15);
        const gr = new THREE.Mesh(
          new THREE.PlaneGeometry(900, LEN),
          new THREE.MeshStandardMaterial({
            map: GT,
            roughness: 1,
            envMapIntensity: 0.2,
          })
        );
        gr.rotation.x = -Math.PI / 2;
        gr.position.set(0, -0.05, -LEN / 2 + 60);
        gr.receiveShadow = true;
        sc.add(gr);
        for (const s of [-1, 1]) {
          const rl = new THREE.Mesh(
            new THREE.BoxGeometry(0.4, 0.9, LEN),
            new THREE.MeshStandardMaterial({
              color: 0xc4c8d0,
              metalness: 0.7,
              roughness: 0.35,
            })
          );
          rl.position.set(s * 12.8, 0.45, -LEN / 2 + 60);
          rl.castShadow = rl.receiveShadow = true;
          sc.add(rl);
        }
        const n = Math.floor(LEN / 22) * 2,
          tr = new THREE.InstancedMesh(
            new THREE.CylinderGeometry(0.35, 0.5, 4, 8),
            new THREE.MeshStandardMaterial({ color: 0x5a3b22, roughness: 1 }),
            n
          ),
          cr = new THREE.InstancedMesh(
            new THREE.IcosahedronGeometry(3, 1),
            new THREE.MeshStandardMaterial({
              color: 0x2a6e32,
              roughness: 0.9,
              flatShading: true,
            }),
            n
          ),
          d = new THREE.Object3D();
        for (let i = 0; i < n; i++) {
          const x = (i % 2 ? 1 : -1) * (18 + Math.random() * 40),
            z = 60 - (i >> 1) * 22 - Math.random() * 10,
            s = 0.8 + Math.random() * 0.8;
          d.position.set(x, 2 * s, z);
          d.scale.set(s, s, s);
          d.updateMatrix();
          tr.setMatrixAt(i, d.matrix);
          d.position.y = 6.5 * s;
          d.scale.set(s, s * 1.5, s);
          d.updateMatrix();
          cr.setMatrixAt(i, d.matrix);
        }
        tr.castShadow = cr.castShadow = true;
        sc.add(tr, cr);
        const fc = document.createElement("canvas");
        fc.width = 96;
        fc.height = 16;
        const fg = fc.getContext("2d");
        for (let i = 0; i < 12; i++)
          for (let j = 0; j < 2; j++) {
            fg.fillStyle = (i + j) % 2 ? "#fff" : "#111";
            fg.fillRect(i * 8, j * 8, 8, 8);
          }
        const ft = enc(new THREE.CanvasTexture(fc));
        ft.magFilter = THREE.NearestFilter;
        const fl = new THREE.Mesh(
          new THREE.PlaneGeometry(24, 4),
          new THREE.MeshBasicMaterial({ map: ft })
        );
        fl.rotation.x = -Math.PI / 2;
        fl.position.set(0, 0.05, -FIN);
        sc.add(fl);
      }
      // realistic car
      function ext(sh, depth, bev, seg = 6) {
        const g = new THREE.ExtrudeGeometry(sh, {
          depth,
          bevelEnabled: true,

        sky.position.copy(cams[0].position);
        R.setViewport(0, 0, w, h);
        R.setScissor(0, 0, w, h);
        R.render(sc, cams[0]);
      }
      function resize() {
        const w = Math.min(innerWidth - 16, 964),
          h = Math.max(300, Math.min(innerHeight - 90, w * 0.55));
        R.setSize(w, h);
        $("wrap").style.width = w + "px";
        $("wrap").style.height = h + "px";
        const c = cams[0];
        c.aspect = w / h;
        c.updateProjectionMatrix();
        c.position.set(0, 3.6, 9);
        c.lookAt(0, 1.6, -20);
        if (cars[0]) cars[0].position.set(0, 0, 0);
        render();
      }
      addEventListener("resize", resize);
      addEventListener("pagehide", () => {
        if (ROOM && ROOM.beacon) ROOM.beacon();
      });
      buildCars();
      THUMBS = makeThumbs();
      resize();
      menu();
      (async () => {
        try {
          RM = window.MRNet ? window.MRNet.makeRM() : null;
        } catch (e) {
          RM = null;
        }
        if (phase === "menu") menu();
      })();
    </script>
  </body>
</html>
